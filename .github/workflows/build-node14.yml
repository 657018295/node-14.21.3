name: Build Node 14 for Darwin ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14 # 使用 macOS ARM64 虚拟机

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment & Download Node.js v14 Source
        run: |
          NODE_VERSION="v14.21.3"
          echo "Downloading Node.js $NODE_VERSION..."
          curl -O https://nodejs.org/dist/$NODE_VERSION/node-$NODE_VERSION.tar.gz
          tar -xzf node-$NODE_VERSION.tar.gz

      - name: Configure Node.js
        run: |
          cd node-v14.21.3
          # 使用原生 arm64 配置，并关闭 npm（减少不必要的编译耗时和潜在错误）
          ./configure --dest-cpu=arm64 --without-npm

      - name: Build Node.js (Make with Compatibility Flags)
        run: |
          cd node-v14.21.3
          # 核心修复：
          # 1. CXXFLAGS="-Wno-error" 阻止 Clang 把古老代码的警告判为死刑
          # 2. GYP_DEFINES 确保针对 macOS arm64 架构正确生成构建规则
          export GYP_DEFINES="host_os=mac OS=mac"
          make -j$(sysctl -n hw.ncpu) CXXFLAGS="-Wno-error -Wno-deprecated-declarations"

      - name: Package and Prepare Artifact
        run: |
          cd node-v14.21.3
          mkdir -p dist-arm64
          make install DESTDIR=$(pwd)/dist-arm64
          
          # 打包产物
          cd dist-arm64
          tar -czf ../../node-v14.21.3-darwin-arm64.tar.gz .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-v14.21.3-darwin-arm64
          path: node-v14.21.3-darwin-arm64.tar.gz
